<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="PNhnhspweDAttE-7hsHlMj_7_Lx6NbWMzrXxvobkciM" />
  
  <title>{% if page.title %}{{ page.title }} | {% endif %}Hairul Anuar Sulaiman</title>
  
  <link rel="icon" type="image/png" sizes="512x512" href="{{ site.baseurl }}/assets/images/favicon.png">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/images/favicon.png">
  
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
  <meta name="author" content="{{ site.author }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}Hairul Anuar Sulaiman">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
  <meta property="og:image" content="{{ site.url }}/assets/images/hairul-anuar.jpeg">
  <meta property="og:locale" content="ms_MY">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style-xubuntu.css">

  {% if page.schema %}
  <!-- Page-specific JSON-LD -->
  {{ page.schema }}
  {% endif %}

  {% if page.faq_schema %}
  <!-- FAQ Page JSON-LD -->
  {{ page.faq_schema }}
  {% endif %}

  <!-- Global Site Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FinancialService",
    "name": "{{ site.title }}",
    "description": "{{ site.description }}",
    "url": "{{ site.url }}",
    "image": "{{ site.url }}/assets/images/hairul-anuar.jpeg",
    "telephone": "{{ site.phone }}",
    "areaServed": "Malaysia",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "{{ site.city }}",
      "addressRegion": "{{ site.state }}",
      "addressCountry": "Malaysia"
    }
  }
  </script>
</head>

<body>

  <!-- PAGE HEADER -->
  {% include header.html %}

  <!-- UNIQUE PAGE CONTENT -->
  <main>
    {{ content }}
  </main>

  <!-- FOOTER -->
  {% include footer.html %}

  <!-- Floating WhatsApp -->
  <aside>
    <a href="https://wa.me/{{ site.phone }}" class="floating-whatsapp" target="_blank" rel="noopener noreferrer" aria-label="Hubungi saya melalui WhatsApp">💬 WhatsApp</a>
  </aside>

  <script>
  // ==========================================
  // MOBILE DROPDOWN TOGGLE & NAV BEHAVIOR
  // ==========================================
  document.addEventListener('DOMContentLoaded', function() {
    const toggleButtons = document.querySelectorAll('.dropdown-toggle');
    
    toggleButtons.forEach(button => {
      button.addEventListener('click', function(e) {
        const parentLi = this.closest('.dropdown');
        const isCurrentlyOpen = parentLi.classList.contains('open');
        
        document.querySelectorAll('.dropdown.open').forEach(d => {
          if (d !== parentLi) {
            d.classList.remove('open');
            d.querySelector('.dropdown-toggle')?.setAttribute('aria-expanded', 'false');
          }
        });
        
        if (isCurrentlyOpen) {
          parentLi.classList.remove('open');
          this.setAttribute('aria-expanded', 'false');
        } else {
          parentLi.classList.add('open');
          this.setAttribute('aria-expanded', 'true');
        }
        
        e.preventDefault();
      });
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.dropdown') && !e.target.closest('.menu-icon')) {
        document.querySelectorAll('.dropdown.open').forEach(d => {
          d.classList.remove('open');
          d.querySelector('.dropdown-toggle')?.setAttribute('aria-expanded', 'false');
        });
      }
    });

    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', function() {
        const checkbox = document.getElementById('menu-toggle');
        if (checkbox && checkbox.checked) {
          checkbox.checked = false;
        }
      });
    });
  });
  </script>

</body>
</html>
