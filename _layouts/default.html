<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- OPEN GRAPH / WHATSAPP PREVIEW TAGS -->
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <!-- ABSOLUTE IMAGE PATH FOR WHATSAPP -->
  {% if page.image %}
    <meta property="og:image" content="{{ page.image | absolute_url }}">
  {% else %}
    <meta property="og:image" content="{{ '/assets/images/homepage/malaysia-rainforest-path-morning-mist.webp' | absolute_url }}">
  {% endif %}
  <meta property="og:image:type" content="image/webp">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="800">

  <!-- TWITTER CARDS -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  {% if page.image %}
    <meta name="twitter:image" content="{{ page.image | absolute_url }}">
  {% else %}
    <meta name="twitter:image" content="{{ '/assets/images/homepage/malaysia-rainforest-path-morning-mist.webp' | absolute_url }}">
  {% endif %}

  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body>

  <!-- 1. GLOBAL HEADER INCLUDE -->
  {% include header.html %}

  <!-- 2. PAGE CONTENT -->
  {{ content }}

  <!-- 3. GLOBAL FOOTER INCLUDE -->
  {% include footer.html %}

</body>
</html>
