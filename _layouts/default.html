<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="PNhnhspweDAttE-7hsHlMj_7_Lx6NbWMzrXxvobkciM" />
  
  <title>{% if page.title %}{{ page.title }} | {% endif %}Hairul Anuar Sulaiman</title>
  
  <link rel="icon" type="image/png" sizes="512x512" href="{{ site.baseurl }}/assets/images/favicon.png">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/images/favicon.png">
  
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
  <meta name="author" content="{{ site.author }}">

  <!-- Open Graph / Meta Sosial Gaya Google Corporate -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}Hairul Anuar Sulaiman">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
  <!-- Menggunakan imej 16:9 yang lebih berautoriti tinggi sebagai paparan media sosial default -->
  <meta property="og:image" content="{% if page.image %}{{ site.url }}{{ page.image }}{% else %}{{ site.url }}/assets/images/perlindungan-takaful-pendapatan-sedia-hadapi-risiko.webp{% endif %}">
  <meta property="og:locale" content="ms_MY">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fail CSS Utama Baharu -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">

  {% if page.schema %}
  <!-- Page-specific JSON-LD (Skema Khusus Halaman) -->
  {{ page.schema }}
  {% endif %}

  {% if page.faq_schema %}
  <!-- FAQ Page JSON-LD (Skema FAQ Google AI-Friendly) -->
  {{ page.faq_schema }}
  {% endif %}

  <!-- Global Site Schema (Skema Standard Kewangan) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FinancialService",
    "name": "Hairul Anuar Sulaiman",
    "description": "{{ site.description }}",
    "url": "{{ site.url }}",
    "image": "{{ site.url }}/assets/images/hairul-anuar.jpeg",
    "telephone": "{{ site.phone }}",
    "areaServed": "Malaysia",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "{{ site.city }}",
      "addressRegion": "{{ site.state }}",
      "addressCountry": "Malaysia"
    }
  }
  </script>
</head>

<body>

  <!-- NAVIGASI UTAMA (GAYA ABOUT.GOOGLE) -->
  {% include header.html %}

  <!-- KANDUNGAN UNIK HALAMAN -->
  <main class="google-main-content">
    {{ content }}
  </main>

  <!-- PENGAKI HALAMAN MINIMALIS -->
  {% include footer.html %}

  <!-- Floating WhatsApp Action Button -->
  <aside>
    <a href="https://wa.me/{{ site.phone }}" class="floating-whatsapp" target="_blank" rel="noopener noreferrer" aria-label="Hubungi saya melalui WhatsApp">💬 WhatsApp</a>
  </aside>

  <!-- Skrip Ringkas Mengawal Penutupan Menu Drawer Selepas Pautan Ditekan -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const menuLinks = document.querySelectorAll('.google-nav-list a');
      menuLinks.forEach(link => {
        link.addEventListener('click', function() {
          const checkbox = document.getElementById('menu-toggle');
          if (checkbox && checkbox.checked) {
            checkbox.checked = false;
          }
        });
      });
    });
  </script>

</body>
</html>
