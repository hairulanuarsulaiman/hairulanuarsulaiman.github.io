---
layout: default
---

<article class="article-container">
  
  <header class="cta-content" aria-labelledby="post-heading">
    <p class="section-eyebrow">{{ page.category }}</p>
    <h1 id="post-heading" class="article-title">{{ page.title }}</h1>
    <p class="article-intro">
      <time datetime="{{ page.date | date_to_xmlschema }}" style="color: var(--slate-400);">
        {{ page.date | date: "%-d %B %Y" }}
      </time>
    </p>
    {% if page.description %}
    <p class="article-intro">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="article-content">
    {{ content }}
  </div>

  <!-- Author Box -->
  {% include author-box.html %}

  <!-- Disclaimer -->
  <div class="disclaimer-container">
    {% include disclaimer.md %}
  </div>

</article>

<!-- ✅ CTA Section (outside article, full-width) -->
{% include cta-section.html %}
