---
layout: base
---

<article class="google-article">
  <!-- 1. Header Halaman Artikel -->
  <header class="google-article-header">
    <div class="google-article-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time>
      {% if page.category %}
        <span class="google-article-divider">•</span>
        <span class="google-article-category">{{ page.category }}</span>
      {% endif %}
    </div>
    <h1 class="google-article-title">{{ page.title }}</h1>
  </header>

  <!-- 2. Kandungan Utama Fail Markdown (.md) -->
  <div class="google-article-content">
    {{ content }}
  </div>

  <!-- 3. Author Box (Jekyll Include yang telah kita bina) -->
  <footer class="google-article-footer">
    {% include author-box.html %}
    
    <!-- Butang Kembali yang Minimalis -->
    <div class="google-article-back">
      <a href="/artikel.html">← Kembali ke Hub Pengetahuan</a>
    </div>
  </footer>
</article>
