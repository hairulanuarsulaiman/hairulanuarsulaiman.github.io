---
layout: default
---

<!-- MASTER EDITORIAL CANVAS (640PX LANE) -->
<main class="luxury-canvas">

  <!-- 1. ARTICLE HEADER -->
  <header style="margin-bottom: 36px;">
    <span class="luxury-article-tag">
      {{ page.category | uppercase }}
    </span>

    <h1 class="luxury-heading" style="margin-bottom: 16px;">
      {{ page.title }}
    </h1>

    <div class="luxury-article-meta">
      <span>{{ page.date | date: "%d %B %Y" }}</span>
      <span class="luxury-article-meta-divider">•</span>
      <span>{{ page.read_time | default: "5" }} minit bacaan</span>
    </div>
  </header>

  <!-- 2. AUTOMATIC GALLERY-FRAMED VISUAL (TIGHTENED SPACING) -->
  {% if page.image %}
    <figure class="luxury-figure" style="margin-bottom: 36px;">
      <img 
        src="{{ page.image | relative_url }}" 
        alt="{{ page.image_alt | default: page.title }}"
        width="1200"
        height="800"
        loading="eager"
      >
      {% if page.image_caption %}
        <figcaption class="luxury-figcaption">
          {{ page.image_caption }}
        </figcaption>
      {% endif %}
    </figure>
    <hr class="luxury-divider" style="margin-bottom: 40px;">
  {% endif %}

  <!-- 3. ARTICLE BODY PROSE -->
  <article class="luxury-article-body">
    {{ content }}
  </article>

  <hr class="luxury-divider" style="margin-top: 60px; margin-bottom: 60px;">

  <!-- 4. MINIMALIST AUTHOR SIGN-OFF -->
  {% include author-box.html %}

  <!-- 5. UNIFORM CALM INVITATION -->
  {% include conversation.html %}

</main>
